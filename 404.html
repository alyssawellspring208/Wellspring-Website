<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | WellSpring Health &amp; Wellness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&amp;display=swap">
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
  font-family: "Jost", "Futura", system-ui, sans-serif; background: #0B4450; color: #fff; }
h1 { font-weight: 400; font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 12px; }
p { color: #DCEFF2; margin: 0 0 28px; }
a { display: inline-block; background: #167C1D; color: #fff; text-decoration: none; padding: 14px 30px; border-radius: 999px; font-weight: 500; }
</style>
</head>
<body>
<main>
<h1>We couldn't find that page</h1>
<p>The link may be old, or the page may have moved.</p>
<a id="home-link" href="/">Go to the home page</a>
</main>
<script>
// On a github.io project site, the home page lives one folder down.
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  if (location.hostname.slice(-10) === 'github.io' && parts.length) {
    document.getElementById('home-link').href = '/' + parts[0] + '/';
  }
})();
</script>
</body>
</html>
